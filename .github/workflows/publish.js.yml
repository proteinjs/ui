name: Publish Ui Packages

on:
  push:
    branches:
      - main

# One publish at a time: two overlapping runs race at the publish step — the earlier run's
# release commit rebases onto the later push and stamps a version/tag whose git history COVERS
# the later commit, while publishing the tarball built from its own older checkout; the later
# run then sees "no changed packages" and the newer code never ships (bit the thought repo
# 2026-07-23 thought-common 3.15.3 and 2026-08-13 thought-ui 3.33.0). The concurrency group
# serializes publish jobs; the "Abort if main advanced" guard closes the remaining window —
# only the run whose checkout is still the branch tip publishes, and the tip push's own run
# releases everything pending.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Configure git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: CI glue self-test (MintServed.js)
        # node:test, needs no install; fails the job before any minute is spent on install/build.
        run: node --test .github/scripts/MintServed.test.js
  
      - name: Setup NPM authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check NPM token validity
        run: |
          if ! npm_output=$(npm org ls proteinjs --json 2>&1); then
            echo "NPM token validation failed. Error details:"
            echo "$npm_output"
            exit 1
          fi
      
      - name: Install root package
        run: |
          npm i
      
      - name: Build packages
        run: |
          npm run build-workspace

      - name: Test packages
        run: |
          npm run test-workspace

      # The stale-checkout guard (see race note at top). Runs AFTER the long install/build/test
      # steps so the unguarded window shrinks from ~30 minutes to the seconds between this check
      # and lerna's push.
      - name: Abort if main advanced (stale-checkout guard)
        id: tip
        run: |
          git fetch origin main --quiet
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "origin/main advanced past this run's checkout — skipping version+publish; the tip push's run releases everything pending (see race note at top of the workflow)."
          fi

      - name: Commit package-locks
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          git add .
          if git diff --staged --exit-code; then
            echo "No changes to commit."
          else
            git commit -m "chore(version) update package-locks [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      - name: Version and Publish
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          npx lerna publish --yes --no-private
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Wait for the registry to serve the mint
        # `lerna publish` returns when the registry has ACCEPTED the tarball, not when it SERVES the
        # new version to a resolver: the packument a `npm i` reads lags the accept by seconds to
        # minutes, so a consumer that raises its floor to this version the moment the run is green
        # gets E404 / ETARGET until the registry catches up. MintServed.js polls `npm view
        # <name>@<version> version` for every tag this run's `lerna publish` made (the tags at HEAD),
        # 10 s apart on one 5-minute clock, one "served after N s" line per package — the run
        # concludes only once the registry serves the mint (or the wait's deadline passes), so a
        # consumer waiting on this run can take the floor at once. A package still not served at the
        # deadline is a WARNING line and exit 1 (`|| [ $? -eq 1 ]`: only a timeout goes on; git or npm
        # unrunnable stops the step). Best-effort by design (continue-on-error): the package is
        # published either way, and a registry still not serving it is the log's warning, not a red job.
        if: steps.tip.outputs.is_tip == 'true'
        continue-on-error: true
        run: node .github/scripts/MintServed.js || [ $? -eq 1 ]
